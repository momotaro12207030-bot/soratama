<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#07080d">
<title>空ノ玉</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@700&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Layout: full-bleed camera stage; brand + sensor status at top, shell controls docked at the bottom over the safe area */
:root{
  --night:#07080d;
  --glass:rgba(10,12,20,.58);
  --glass-strong:rgba(10,12,20,.84);
  --hair:rgba(255,255,255,.15);
  --paper:#f3efe6;
  --dim:#aaa59b;
  --gold:#ffb547;
  --go:#7ee08a;
  --warn:#ffc27a;
  --font-display:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  --font-body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--night);color:var(--paper);
  font:500 14px/1.6 var(--font-body);
  overflow:hidden;overscroll-behavior:none;touch-action:none;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit;cursor:pointer;-webkit-appearance:none;appearance:none;background:none;border:0}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
[hidden]{display:none!important}

#cam,#fx{position:fixed;inset:0;width:100%;height:100%}
#cam{object-fit:cover;background:var(--night)}
#fx{display:block}
body.cam-on #fx{mix-blend-mode:screen}

.reticle{position:fixed;left:50%;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;pointer-events:none;opacity:.4}
.reticle::before,.reticle::after{content:"";position:absolute;background:var(--paper)}
.reticle::before{left:50%;top:0;bottom:0;width:1px;transform:translateX(-.5px)}
.reticle::after{top:50%;left:0;right:0;height:1px;transform:translateY(-.5px)}

.top{
  position:fixed;top:0;left:0;right:0;z-index:2;
  display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 0;pointer-events:none;
}
.mark{font-family:var(--font-display);font-size:20px;letter-spacing:.14em;text-shadow:0 1px 10px rgba(0,0,0,.7)}
.status{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.chip{
  display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;
  background:var(--glass);border:1px solid var(--hair);font-size:11.5px;letter-spacing:.06em;color:var(--dim);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
}
.chip i{width:6px;height:6px;border-radius:50%;background:var(--dim);opacity:.6}
.chip.on{color:var(--paper)}
.chip.on i{background:var(--go);opacity:1;box-shadow:0 0 6px var(--go)}

.hint{
  position:fixed;left:16px;right:16px;top:36%;margin:0;text-align:center;
  font-size:13px;letter-spacing:.08em;color:var(--paper);opacity:.85;
  text-shadow:0 1px 10px rgba(0,0,0,.85);pointer-events:none;transition:opacity .8s;
}
.hint.gone{opacity:0}

.dock{
  position:fixed;left:0;right:0;bottom:0;z-index:3;
  display:flex;flex-direction:column;gap:10px;
  padding:28px 16px calc(env(safe-area-inset-bottom,0px) + 14px);
  background:linear-gradient(to top,rgba(5,6,10,.8),rgba(5,6,10,0));
  pointer-events:none;
}
.dock > *{pointer-events:auto}
.dock > .readout{pointer-events:none}
.readout{
  font-size:12px;color:var(--dim);letter-spacing:.04em;min-height:1.6em;
  font-variant-numeric:tabular-nums;text-shadow:0 1px 6px rgba(0,0,0,.8);
}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.seg{
  display:inline-flex;padding:3px;border-radius:999px;background:var(--glass);border:1px solid var(--hair);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
}
.seg button{height:34px;min-width:56px;padding:0 12px;border-radius:999px;font-size:13px;letter-spacing:.04em;color:var(--dim)}
.seg button[aria-pressed="true"]{background:var(--paper);color:var(--night);font-weight:700}
.tools{display:flex;gap:8px}
.tool{
  height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--hair);background:var(--glass);
  font-size:13px;letter-spacing:.04em;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
}
.tool[aria-pressed="true"]{border-color:var(--gold);color:var(--gold);background:rgba(255,181,71,.12)}
.types{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px;touch-action:pan-x}
.types::-webkit-scrollbar{display:none}
.types button{
  flex:0 0 auto;height:42px;padding:0 18px;border-radius:12px;border:1px solid var(--hair);background:var(--glass);
  font-family:var(--font-display);font-size:17px;letter-spacing:.1em;
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
}
.types button[data-type="auto"]{font-family:var(--font-body);font-size:13px;letter-spacing:.04em}
.types button[aria-pressed="true"]{border-color:var(--gold);color:var(--gold);background:rgba(255,181,71,.12)}

.fov{
  display:grid;gap:8px;padding:12px 14px;border-radius:14px;
  background:var(--glass-strong);border:1px solid var(--hair);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
}
.fov label{display:flex;justify-content:space-between;font-size:13px}
.fov output{font-variant-numeric:tabular-nums;color:var(--gold)}
.fov input{width:100%;accent-color:var(--gold);touch-action:pan-x}
.fov p{margin:0;font-size:12px;color:var(--dim)}

.intro{
  position:fixed;inset:0;z-index:10;display:grid;place-items:end center;
  padding:24px 16px calc(env(safe-area-inset-bottom,0px) + 28px);
  background:linear-gradient(to top,rgba(7,8,13,.94) 0%,rgba(7,8,13,.6) 52%,rgba(7,8,13,.1) 100%);
  touch-action:manipulation;
}
.intro-inner{width:100%;max-width:420px;display:flex;flex-direction:column;gap:14px}
.intro h1{
  margin:0;font-family:var(--font-display);font-weight:700;
  font-size:clamp(48px,15vw,76px);line-height:1;letter-spacing:.16em;text-wrap:balance;
  text-shadow:0 2px 24px rgba(0,0,0,.6);
}
.lead{margin:0;font-size:16px;line-height:1.75}
.facts{margin:0;padding:0;list-style:none;display:grid;gap:6px;color:var(--dim);font-size:13px}
.facts li{position:relative;padding-left:16px}
.facts li::before{content:"";position:absolute;left:2px;top:.75em;width:5px;height:5px;border-radius:50%;background:var(--gold)}
.primary{height:52px;border-radius:14px;background:var(--gold);color:#1b1206;font-weight:700;font-size:16px;letter-spacing:.06em}
.secondary{height:44px;border-radius:14px;border:1px solid var(--hair);color:var(--paper)}
.note{margin:0;font-size:12px;color:var(--warn)}

body.intro-open .top,body.intro-open .dock,body.intro-open .hint,body.intro-open .reticle{visibility:hidden}

.toast{
  position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 52px);z-index:20;
  max-width:calc(100% - 32px);padding:10px 14px;border-radius:12px;
  background:var(--glass-strong);border:1px solid var(--hair);font-size:13px;
  opacity:0;transform:translate(-50%,-8px);transition:opacity .3s,transform .3s;pointer-events:none;
}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){.toast,.hint{transition:none}}
</style>
</head>
<body class="intro-open">

<video id="cam" playsinline muted autoplay hidden></video>
<canvas id="fx" aria-label="花火の表示面。タップした方向に打ち上がります"></canvas>
<div class="reticle" aria-hidden="true"></div>

<header class="top">
  <span class="mark">空ノ玉</span>
  <div class="status">
    <span class="chip" id="stCam"><i></i><span>カメラ</span></span>
    <span class="chip" id="stGyro"><i></i><span>傾き</span></span>
  </div>
</header>

<p class="hint" id="hint">空をタップすると、そこに打ち上がります</p>

<div class="dock">
  <div class="fov" id="fovPanel" hidden>
    <label for="fovRange">画角（画面の長辺）<output id="fovOut">66°</output></label>
    <input type="range" id="fovRange" min="40" max="95" step="1" value="66">
    <p>スマホを動かしたとき、花火が景色からずれて見える場合に合わせます。広角レンズなら大きめに。</p>
  </div>
  <div class="readout" id="readout"></div>
  <div class="row">
    <div class="seg" id="sizeSeg" role="group" aria-label="玉の大きさ">
      <button type="button" data-size="3" aria-pressed="false">3号</button>
      <button type="button" data-size="5" aria-pressed="true">5号</button>
      <button type="button" data-size="10" aria-pressed="false">10号</button>
    </div>
    <div class="tools">
      <button type="button" class="tool" id="btnAuto" aria-pressed="false">連発</button>
      <button type="button" class="tool" id="btnSound" aria-pressed="true">音</button>
      <button type="button" class="tool" id="btnFov" aria-pressed="false">画角</button>
    </div>
  </div>
  <div class="types" id="typeRow" role="group" aria-label="花火の種類">
    <button type="button" data-type="auto" aria-pressed="true">おまかせ</button>
    <button type="button" data-type="kiku" aria-pressed="false">菊</button>
    <button type="button" data-type="botan" aria-pressed="false">牡丹</button>
    <button type="button" data-type="yanagi" aria-pressed="false">柳</button>
    <button type="button" data-type="senrin" aria-pressed="false">千輪</button>
  </div>
</div>

<section class="intro" id="intro">
  <div class="intro-inner">
    <h1>空ノ玉</h1>
    <p class="lead">スマホのカメラを夜空へ。タップした場所に花火が上がります。</p>
    <ul class="facts">
      <li>3号・5号・10号の玉を、実際の打ち上げ高度で上げます</li>
      <li>スマホを動かしても、花火は空の同じ場所に咲いたままです</li>
      <li>音は距離に合わせて、光から遅れて届きます</li>
    </ul>
    <button type="button" class="primary" id="goCam">カメラで始める</button>
    <button type="button" class="secondary" id="goNoCam">カメラなしで試す</button>
    <p class="note" id="secureNote" hidden>このページは https:// で開かれていないため、カメラと傾きセンサーが使えないことがあります。</p>
  </div>
</section>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
'use strict';
const D2R = Math.PI / 180;
const EYE = 1.5;            // 目の高さ (m)。地面は z = -EYE
const SOUND_SPEED = 340;    // m/s
const $ = s => document.querySelector(s);
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const pick = a => a[(Math.random() * a.length) | 0];

const video = $('#cam'), cv = $('#fx'), ctx = cv.getContext('2d');
const stCam = $('#stCam'), stGyro = $('#stGyro');

// 玉の号数ごとの目安（打ち上げ高度・開花直径）
const SHELLS = {
  '3':  { label: '3号',  alt: 120, dia: 60,  k: 0.6 },
  '5':  { label: '5号',  alt: 190, dia: 170, k: 1.0 },
  '10': { label: '10号', alt: 330, dia: 320, k: 1.6 },
};
const TYPES = { kiku: '菊', botan: '牡丹', yanagi: '柳', senrin: '千輪' };
const C = {
  red: [255, 72, 56], green: [86, 255, 128], blue: [92, 140, 255], gold: [255, 196, 96],
  silver: [232, 238, 255], purple: [196, 108, 255], orange: [255, 138, 44], cyan: [96, 232, 255], pink: [255, 120, 190],
};
const MAIN = Object.values(C);

const state = { size: '5', type: 'auto', auto: false, sound: true, fov: 66, started: false, camOn: false, gyro: false };
try { const v = parseFloat(localStorage.getItem('soranotama.fov')); if (v >= 40 && v <= 95) state.fov = v; } catch (e) {}

// ---------- canvas ----------
let W = 0, H = 0, focal = 800;
function updateFocal() { focal = (Math.max(W, H) / 2) / Math.tan(state.fov * D2R / 2); }
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  updateFocal();
}
window.addEventListener('resize', resize);
resize();

// ---------- vectors / camera ----------
const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const norm = a => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; };

// 世界座標: x=東, y=北, z=上。cam.r/u/f は画面の右・上・奥（視線）方向
const cam = { r: [1, 0, 0], u: [0, 0, 1], f: [0, 1, 0] };
const tgt = { r: [1, 0, 0], u: [0, 0, 1], f: [0, 1, 0] };
let yaw = 0, pitch = 0.32, gotOrient = false;

function setFromYawPitch() {
  const cp = Math.cos(pitch);
  cam.f = [Math.sin(yaw) * cp, Math.cos(yaw) * cp, Math.sin(pitch)];
  cam.r = [Math.cos(yaw), -Math.sin(yaw), 0];
  cam.u = cross(cam.r, cam.f);
}
setFromYawPitch();

function rotX(t) { const c = Math.cos(t), s = Math.sin(t); return [1, 0, 0, 0, c, -s, 0, s, c]; }
function rotY(t) { const c = Math.cos(t), s = Math.sin(t); return [c, 0, s, 0, 1, 0, -s, 0, c]; }
function rotZ(t) { const c = Math.cos(t), s = Math.sin(t); return [c, -s, 0, s, c, 0, 0, 0, 1]; }
function mul(A, B) {
  const o = new Array(9);
  for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++)
    o[i * 3 + j] = A[i * 3] * B[j] + A[i * 3 + 1] * B[3 + j] + A[i * 3 + 2] * B[6 + j];
  return o;
}
function screenAngle() {
  if (screen.orientation && typeof screen.orientation.angle === 'number') return screen.orientation.angle;
  return typeof window.orientation === 'number' ? window.orientation : 0;
}
function onOrient(e) {
  if (e.alpha == null || e.beta == null || e.gamma == null) return;
  // W3C: R = Rz(alpha)·Rx(beta)·Ry(gamma)、さらに画面の回転を打ち消す
  const M = mul(mul(mul(rotZ(e.alpha * D2R), rotX(e.beta * D2R)), rotY(e.gamma * D2R)), rotZ(-screenAngle() * D2R));
  tgt.r = [M[0], M[3], M[6]];
  tgt.u = [M[1], M[4], M[7]];
  tgt.f = [-M[2], -M[5], -M[8]];   // 背面カメラは端末の -z 方向
  if (!gotOrient) {
    gotOrient = true; state.gyro = true;
    cam.r = tgt.r.slice(); cam.u = tgt.u.slice(); cam.f = tgt.f.slice();
    setChip(stGyro, true, '傾き');
    $('#hint').textContent = '空をタップすると、そこに打ち上がります';
  }
}
function smoothCam(dt) {
  const k = 1 - Math.exp(-dt * 20);
  for (const key of ['r', 'u', 'f']) {
    const a = cam[key], b = tgt[key];
    a[0] += (b[0] - a[0]) * k; a[1] += (b[1] - a[1]) * k; a[2] += (b[2] - a[2]) * k;
  }
  const f = norm(cam.f);
  const d = dot(cam.r, f);
  const r = norm([cam.r[0] - f[0] * d, cam.r[1] - f[1] * d, cam.r[2] - f[2] * d]);
  cam.f = f; cam.r = r; cam.u = cross(r, f);
}
function project(x, y, z, o) {
  const f = cam.f, r = cam.r, u = cam.u;
  const zc = x * f[0] + y * f[1] + z * f[2];
  if (zc < 2) return false;
  o.x = W / 2 + (x * r[0] + y * r[1] + z * r[2]) / zc * focal;
  o.y = H / 2 - (x * u[0] + y * u[1] + z * u[2]) / zc * focal;
  o.z = zc;
  return true;
}
function dirFromScreen(sx, sy) {
  const dx = (sx - W / 2) / focal, dy = -(sy - H / 2) / focal;
  return norm([
    cam.f[0] + cam.r[0] * dx + cam.u[0] * dy,
    cam.f[1] + cam.r[1] * dx + cam.u[1] * dy,
    cam.f[2] + cam.r[2] * dx + cam.u[2] * dy,
  ]);
}

// ---------- audio ----------
let AC = null, master = null, noiseBuf = null;
function initAudio() {
  if (AC) return;
  const A = window.AudioContext || window.webkitAudioContext;
  if (!A) return;
  try {
    AC = new A();
    const comp = AC.createDynamicsCompressor();
    master = AC.createGain(); master.gain.value = 0.9;
    master.connect(comp); comp.connect(AC.destination);
    const len = AC.sampleRate * 2;
    noiseBuf = AC.createBuffer(1, len, AC.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  } catch (e) { AC = null; }
}
const canPlay = () => state.sound && AC && AC.state === 'running';
function env(g, t, peak, att, dec) {
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(Math.max(peak, 0.0002), t + att);
  g.gain.exponentialRampToValueAtTime(0.0001, t + att + dec);
}
function noiseHit(t, o) {
  const s = AC.createBufferSource(); s.buffer = noiseBuf;
  const f = AC.createBiquadFilter(); f.type = o.type || 'lowpass'; f.Q.value = o.q || 0.7;
  f.frequency.setValueAtTime(o.f0, t); f.frequency.exponentialRampToValueAtTime(o.f1, t + o.dec);
  const g = AC.createGain(); env(g, t, o.peak, 0.008, o.dec);
  s.connect(f); f.connect(g); g.connect(master);
  s.start(t, Math.random() * 1.2); s.stop(t + o.dec + 0.1);
}
function tone(t, o) {
  const osc = AC.createOscillator(); osc.type = 'sine';
  osc.frequency.setValueAtTime(o.f0, t); osc.frequency.exponentialRampToValueAtTime(o.f1, t + o.dec);
  const g = AC.createGain(); env(g, t, o.peak, 0.006, o.dec);
  osc.connect(g); g.connect(master); osc.start(t); osc.stop(t + o.dec + 0.1);
}
function boomSound(delay, k, dist, glitter) {
  if (!canPlay()) return;
  const t = AC.currentTime + delay, v = clamp(260 / dist, 0.2, 1) * (0.55 + 0.35 * k);
  noiseHit(t, { peak: 0.9 * v, f0: 1400, f1: 90, dec: 1.5 + 0.4 * k });
  tone(t, { f0: 85, f1: 30, peak: 0.8 * v, dec: 0.6 + 0.2 * k });
  noiseHit(t + 0.28, { peak: 0.12 * v, f0: 500, f1: 80, dec: 2.2 });           // 山びこ
  if (glitter) noiseHit(t + 0.9, { peak: 0.05 * v, f0: 7000, f1: 3500, dec: 2.2, type: 'highpass' });
}
function popSound(delay, dist) {
  if (!canPlay()) return;
  const t = AC.currentTime + delay, v = clamp(200 / dist, 0.15, 0.8);
  noiseHit(t, { peak: 0.35 * v, f0: 3000, f1: 400, dec: 0.18, type: 'bandpass', q: 0.8 });
  tone(t, { f0: 160, f1: 60, peak: 0.2 * v, dec: 0.15 });
}
function launchSound(delay, dur, dist) {
  if (!canPlay()) return;
  const t = AC.currentTime + delay, v = clamp(220 / dist, 0.2, 1);
  noiseHit(t, { peak: 0.25 * v, f0: 600, f1: 80, dec: 0.35 });
  if (Math.random() < 0.55) {   // 笛付きの玉
    const o = AC.createOscillator(); o.type = 'sine';
    o.frequency.setValueAtTime(1900, t + 0.05);
    o.frequency.exponentialRampToValueAtTime(650, t + dur * 0.95);
    const g = AC.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.035 * v, t + 0.2);
    g.gain.linearRampToValueAtTime(0.0001, t + dur * 0.95);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + dur);
  }
}

// ---------- simulation ----------
const groups = [], rockets = [], sparks = [], flashes = [], pending = [];
const ambient = { c: [0, 0, 0], a: 0 };

function partCount() { let n = 0; for (const g of groups) n += g.parts.length; return n; }

function makeGroup(o) {
  const g = {
    ox: o.x, oy: o.y, oz: o.z, age: 0, life: o.life, L: o.L, color: o.color, change: o.change || null,
    size: o.size, flicker: !!o.flicker, drag: o.drag, grav: o.grav, onDeath: o.onDeath || null, parts: [],
  };
  const n = Math.max(4, Math.round(o.n)), golden = Math.PI * (3 - Math.sqrt(5)), off = Math.random() * Math.PI * 2;
  for (let i = 0; i < n; i++) {
    const yy = 1 - 2 * (i + 0.5) / n, rad = Math.sqrt(1 - yy * yy), th = i * golden + off;
    let dx = Math.cos(th) * rad + rand(-0.06, 0.06), dy = yy + rand(-0.06, 0.06), dz = Math.sin(th) * rad + rand(-0.06, 0.06);
    const sp = o.speed * rand(0.9, 1.02) / (Math.hypot(dx, dy, dz) || 1);
    g.parts.push({
      x: o.x, y: o.y, z: o.z, vx: dx * sp, vy: dy * sp, vz: dz * sp,
      life: o.life * rand(0.82, 1.12), h: new Float32Array(o.L * 3), hi: 0, hn: 0, dead: false,
    });
  }
  groups.push(g);
  return g;
}

function launchAt(dir, size, type, fromUser) {
  const S = SHELLS[size];
  let hx = dir[0], hy = dir[1], hl = Math.hypot(hx, hy);
  if (hl < 0.05) { hx = cam.f[0]; hy = cam.f[1]; hl = Math.hypot(hx, hy); if (hl < 0.05) { hx = 0; hy = 1; hl = 1; } }
  const el = clamp(Math.atan2(dir[2], Math.hypot(dir[0], dir[1])), 4 * D2R, 80 * D2R);
  // 号数の高度で咲くように距離を決め、タップした方向にぴったり合わせる
  const D = clamp(S.alt / Math.tan(el), 130, 900);
  const alt = Math.min(D * Math.tan(el), S.alt * 1.7);
  const ex = hx / hl * D, ey = hy / hl * D;
  const sx = ex + rand(-4, 4), sy = ey + rand(-4, 4);
  const dur = 1.0 + alt / 120;
  rockets.push({ sx, sy, sz: -EYE, ex, ey, ez: alt, x: sx, y: sy, z: -EYE, px: sx, py: sy, pz: -EYE, t: 0, dur, size, type, ph: Math.random() * 6, sa: 0 });
  const ld = Math.hypot(sx, sy);
  launchSound(ld / SOUND_SPEED, dur, ld);
  if (fromUser) $('#hint').classList.add('gone');
}

function pickType() { return pick(['kiku', 'kiku', 'botan', 'botan', 'yanagi', 'senrin']); }

function burst(r) {
  const S = SHELLS[r.size], R = S.dia / 2, k = S.k, sk = Math.sqrt(k), x = r.ex, y = r.ey, z = r.ez;
  const type = r.type === 'auto' ? pickType() : r.type;
  const dist = Math.hypot(x, y, z + EYE);
  const ns = partCount() > 3200 ? 0.5 : 1;
  let col;
  if (type === 'kiku') {
    col = pick(MAIN);
    const c2 = Math.random() < 0.6 ? pick(MAIN.filter(c => c !== col)) : null;
    makeGroup({ x, y, z, n: 150 * k * ns, speed: R * 1.7, drag: 1.7, grav: 1, life: 2.5 + 0.5 * k, L: 7, color: col, change: c2 ? { at: 0.55, color: c2 } : null, size: 1.5 * sk });
    if (Math.random() < 0.55) makeGroup({ x, y, z, n: 60 * k * ns, speed: R * 0.45 * 1.9, drag: 1.9, grav: 1, life: 2.0 + 0.3 * k, L: 5, color: pick(MAIN), size: 1.3 * sk });
  } else if (type === 'botan') {
    col = pick(MAIN);
    makeGroup({ x, y, z, n: 170 * k * ns, speed: R * 1.9, drag: 1.9, grav: 1, life: 2.2 + 0.4 * k, L: 3, color: col, size: 2.0 * sk, flicker: true });
    if (Math.random() < 0.5) makeGroup({ x, y, z, n: 70 * k * ns, speed: R * 0.5 * 2.0, drag: 2.0, grav: 1, life: 1.9 + 0.3 * k, L: 3, color: pick(MAIN.filter(c => c !== col)), size: 1.8 * sk, flicker: true });
  } else if (type === 'yanagi') {
    col = [255, 176, 72];
    makeGroup({ x, y, z, n: 110 * k * ns, speed: R * 0.8 * 2.4, drag: 2.4, grav: 2.6, life: 4.4 + 0.6 * k, L: 18, color: col, size: 1.1 * sk, flicker: true });
  } else {
    col = [255, 214, 150];
    makeGroup({
      x, y, z, n: 8 + Math.round(4 * k), speed: R * 0.75 * 1.8, drag: 1.8, grav: 1, life: 1.1, L: 6, color: col, size: 1.0 * sk,
      onDeath: p => {
        const c = pick(MAIN), dd = Math.hypot(p.x, p.y, p.z + EYE);
        makeGroup({ x: p.x, y: p.y, z: p.z, n: 28, speed: (10 + 8 * k) * 2.3, drag: 2.3, grav: 1, life: rand(0.9, 1.3), L: 2, color: c, size: 1.0 * sk, flicker: true });
        flashes.push({ x: p.x, y: p.y, z: p.z, t: 0, dur: 0.18, r: 12 * k, c });
        popSound(dd / SOUND_SPEED, dd);
      },
    });
  }
  flashes.push({ x, y, z, t: 0, dur: 0.32, r: R, c: col });
  ambient.c = col; ambient.a = Math.min(0.22, ambient.a + 0.1 * k);
  boomSound(dist / SOUND_SPEED, k, dist, type === 'botan' || type === 'yanagi');
  if (state.started) {
    $('#readout').textContent = `${S.label}玉　${TYPES[type]}　距離 ${Math.round(dist)} m　音まで ${(dist / SOUND_SPEED).toFixed(1)} 秒`;
  }
}

function updateGroup(g, dt) {
  g.age += dt;
  const dragF = Math.exp(-g.drag * dt), gz = 9.8 * g.grav * dt;
  let alive = 0;
  for (const p of g.parts) {
    if (p.dead) continue;
    if (g.age >= p.life) { p.dead = true; if (g.onDeath) pending.push(() => g.onDeath(p)); continue; }
    const i = p.hi * 3;
    p.h[i] = p.x; p.h[i + 1] = p.y; p.h[i + 2] = p.z;
    p.hi = (p.hi + 1) % g.L; if (p.hn < g.L) p.hn++;
    p.vx *= dragF; p.vy *= dragF; p.vz = p.vz * dragF - gz;
    p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt;
    alive++;
  }
  if (alive && alive < g.parts.length * 0.5) g.parts = g.parts.filter(p => !p.dead);
  return alive > 0;
}

let clock = 0, nextAuto = 0.8;
function autoLaunch() {
  const fy = Math.atan2(cam.f[0], cam.f[1]), fp = Math.asin(clamp(cam.f[2], -1, 1));
  const y = fy + rand(-0.38, 0.38), e = clamp(fp + rand(-0.15, 0.2), 0.15, 1.1);
  const dir = [Math.sin(y) * Math.cos(e), Math.cos(y) * Math.cos(e), Math.sin(e)];
  const size = state.started ? state.size : pick(['3', '5', '5', '10']);
  launchAt(dir, size, state.started ? state.type : 'auto', false);
}

function step(dt) {
  if ((state.auto || !state.started) && clock > nextAuto) {
    autoLaunch();
    nextAuto = clock + (Math.random() < 0.25 ? rand(0.15, 0.35) : rand(0.9, 2.0)) * (state.started ? 1 : 1.3);
  }
  for (let i = rockets.length - 1; i >= 0; i--) {
    const r = rockets[i];
    r.t += dt;
    const p = Math.min(1, r.t / r.dur), e = 1 - (1 - p) * (1 - p);
    r.px = r.x; r.py = r.y; r.pz = r.z;
    const w = Math.sin(r.t * 13 + r.ph) * 0.6;
    r.x = r.sx + (r.ex - r.sx) * e + w; r.y = r.sy + (r.ey - r.sy) * e + w * 0.5; r.z = r.sz + (r.ez - r.sz) * e;
    r.sa += dt;
    while (r.sa > 0.016) {
      r.sa -= 0.016;
      sparks.push({ x: r.x, y: r.y, z: r.z, vx: rand(-3, 3), vy: rand(-3, 3), vz: rand(-6, 1), life: rand(0.35, 0.8), age: 0 });
    }
    if (p >= 1) { rockets.splice(i, 1); burst(r); }
  }
  for (let i = groups.length - 1; i >= 0; i--) if (!updateGroup(groups[i], dt)) groups.splice(i, 1);
  while (pending.length) pending.shift()();
  const sd = Math.exp(-2 * dt);
  for (let i = sparks.length - 1; i >= 0; i--) {
    const s = sparks[i];
    s.age += dt;
    if (s.age > s.life) { sparks.splice(i, 1); continue; }
    s.vx *= sd; s.vy *= sd; s.vz = s.vz * sd - 9.8 * dt;
    s.x += s.vx * dt; s.y += s.vy * dt; s.z += s.vz * dt;
  }
  for (let i = flashes.length - 1; i >= 0; i--) { flashes[i].t += dt; if (flashes[i].t > flashes[i].dur) flashes.splice(i, 1); }
  ambient.a *= Math.exp(-dt * 4);
}

// ---------- drawing ----------
const P = { x: 0, y: 0, z: 0 }, Q = { x: 0, y: 0, z: 0 }, P2 = { x: 0, y: 0, z: 0 };
const STARS = [];
for (let i = 0; i < 420; i++) {
  const z = rand(-0.02, 1), th = rand(0, Math.PI * 2), r = Math.sqrt(1 - z * z);
  STARS.push([Math.cos(th) * r * 1e4, Math.sin(th) * r * 1e4, z * 1e4, rand(0.2, 0.9), rand(0.6, 1.6)]);
}

function drawSky() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#04060d'); g.addColorStop(1, '#0d1325');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#e6ebff';
  for (const s of STARS) {
    if (!project(s[0], s[1], s[2], P)) continue;
    if (P.x < 0 || P.x > W || P.y < 0 || P.y > H) continue;
    ctx.globalAlpha = s[3]; ctx.fillRect(P.x, P.y, s[4], s[4]);
  }
  ctx.globalAlpha = 1;
  // 地平線より下を地面として塗る
  const hx = cam.f[0], hy = cam.f[1], hl = Math.hypot(hx, hy);
  if (hl < 0.05) return;
  const bx = hx / hl, by = hy / hl, a = 0.6, ca = Math.cos(a), sa = Math.sin(a);
  const A = { x: 0, y: 0, z: 0 }, B = { x: 0, y: 0, z: 0 }, G = { x: 0, y: 0, z: 0 };
  if (!project((bx * ca - by * sa) * 1e4, (bx * sa + by * ca) * 1e4, -EYE, A)) return;
  if (!project((bx * ca + by * sa) * 1e4, (-bx * sa + by * ca) * 1e4, -EYE, B)) return;
  let dx = B.x - A.x, dy = B.y - A.y; const dl = Math.hypot(dx, dy) || 1; dx /= dl; dy /= dl;
  let nx = -dy, ny = dx;
  if (project(bx * 40, by * 40, -EYE, G)) { if ((G.x - A.x) * nx + (G.y - A.y) * ny < 0) { nx = -nx; ny = -ny; } }
  else if (ny < 0) { nx = -nx; ny = -ny; }
  const L = 6000;
  ctx.fillStyle = '#030409';
  ctx.beginPath();
  ctx.moveTo(A.x - dx * L, A.y - dy * L);
  ctx.lineTo(B.x + dx * L, B.y + dy * L);
  ctx.lineTo(B.x + dx * L + nx * L, B.y + dy * L + ny * L);
  ctx.lineTo(A.x - dx * L + nx * L, A.y - dy * L + ny * L);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(150,170,220,.16)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(A.x - dx * L, A.y - dy * L); ctx.lineTo(B.x + dx * L, B.y + dy * L); ctx.stroke();
}

function drawGroup(g) {
  if (!project(g.ox, g.oy, g.oz, P)) return;
  const ppm = focal / P.z, lw = clamp(g.size * ppm, 0.8, 7);
  const fadeStart = g.life * 0.62;
  const a = g.age < fadeStart ? 1 : clamp(1 - (g.age - fadeStart) / (g.life * 0.5), 0, 1);
  if (a <= 0.01) return;
  const c = g.change && g.age > g.change.at * g.life ? g.change.color : g.color;
  const trail = new Path2D(), heads = new Path2D(), hs = lw * 1.7, L = g.L;
  let any = false;
  for (const p of g.parts) {
    if (p.dead) continue;
    if (g.flicker && g.age > g.life * 0.45 && Math.random() < 0.5) continue;
    if (!project(p.x, p.y, p.z, Q)) continue;
    trail.moveTo(Q.x, Q.y);
    for (let k = 1; k <= p.hn; k++) {
      const idx = ((p.hi - k + L) % L) * 3;
      if (!project(p.h[idx], p.h[idx + 1], p.h[idx + 2], P2)) break;
      trail.lineTo(P2.x, P2.y);
    }
    heads.rect(Q.x - hs / 2, Q.y - hs / 2, hs, hs);
    any = true;
  }
  if (!any) return;
  ctx.strokeStyle = `rgba(${c[0]},${c[1]},${c[2]},${0.2 * a})`;
  ctx.lineWidth = lw * 3.2; ctx.stroke(trail);
  ctx.strokeStyle = `rgba(${(c[0] * 0.7 + 76) | 0},${(c[1] * 0.7 + 76) | 0},${(c[2] * 0.7 + 76) | 0},${a})`;
  ctx.lineWidth = lw; ctx.stroke(trail);
  ctx.fillStyle = `rgba(255,248,236,${a})`; ctx.fill(heads);
}

function draw() {
  ctx.globalCompositeOperation = 'source-over';
  if (state.camOn) ctx.clearRect(0, 0, W, H); else drawSky();
  ctx.globalCompositeOperation = 'lighter';
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  for (const g of groups) drawGroup(g);

  // 上昇中の玉の火の粉
  const sp = new Path2D();
  for (const s of sparks) { if (project(s.x, s.y, s.z, Q)) sp.rect(Q.x - 0.8, Q.y - 0.8, 1.6, 1.6); }
  ctx.fillStyle = 'rgba(255,196,120,.75)'; ctx.fill(sp);
  for (const r of rockets) {
    if (!project(r.x, r.y, r.z, Q)) continue;
    if (project(r.px, r.py, r.pz, P2)) {
      ctx.strokeStyle = 'rgba(255,220,170,.8)'; ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.moveTo(Q.x, Q.y); ctx.lineTo(P2.x, P2.y); ctx.stroke();
    }
    ctx.fillStyle = 'rgba(255,240,215,.95)';
    ctx.beginPath(); ctx.arc(Q.x, Q.y, 1.8, 0, Math.PI * 2); ctx.fill();
  }
  for (const f of flashes) {
    if (!project(f.x, f.y, f.z, Q)) continue;
    const a = 1 - f.t / f.dur, rad = Math.max(6, f.r * 0.55 * focal / Q.z), c = f.c;
    const g = ctx.createRadialGradient(Q.x, Q.y, 0, Q.x, Q.y, rad);
    g.addColorStop(0, `rgba(255,250,235,${0.9 * a})`);
    g.addColorStop(0.2, `rgba(${c[0]},${c[1]},${c[2]},${0.45 * a})`);
    g.addColorStop(1, `rgba(${c[0]},${c[1]},${c[2]},0)`);
    ctx.fillStyle = g; ctx.fillRect(Q.x - rad, Q.y - rad, rad * 2, rad * 2);
  }
  if (ambient.a > 0.003) {
    const c = ambient.c;
    ctx.fillStyle = `rgba(${c[0]},${c[1]},${c[2]},${ambient.a})`;
    ctx.fillRect(0, 0, W, H);
  }
  ctx.globalCompositeOperation = 'source-over';
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, Math.max(0, (now - last) / 1000));
  last = now; clock += dt;
  if (state.gyro) smoothCam(dt); else setFromYawPitch();
  step(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// ---------- input ----------
const pointers = new Map();
cv.addEventListener('pointerdown', e => {
  if (!state.started) return;
  pointers.set(e.pointerId, { lx: e.clientX, ly: e.clientY, moved: 0 });
  if (cv.setPointerCapture) { try { cv.setPointerCapture(e.pointerId); } catch (err) {} }
});
cv.addEventListener('pointermove', e => {
  const p = pointers.get(e.pointerId);
  if (!p) return;
  const dx = e.clientX - p.lx, dy = e.clientY - p.ly;
  p.lx = e.clientX; p.ly = e.clientY; p.moved += Math.abs(dx) + Math.abs(dy);
  if (!state.gyro && pointers.size === 1) { yaw -= dx / focal; pitch = clamp(pitch + dy / focal, -0.35, 1.45); }
});
cv.addEventListener('pointerup', e => {
  const p = pointers.get(e.pointerId);
  if (!p) return;
  pointers.delete(e.pointerId);
  if (p.moved < 10) launchAt(dirFromScreen(e.clientX, e.clientY), state.size, state.type, true);
});
cv.addEventListener('pointercancel', e => pointers.delete(e.pointerId));
window.addEventListener('keydown', e => {
  if (!state.started || e.repeat) return;
  if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); launchAt(cam.f, state.size, state.type, true); }
});

// ---------- UI ----------
let toastTimer = 0;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 3200);
}
function setChip(el, on, label) { el.classList.toggle('on', on); el.querySelector('span').textContent = label; }
function setPressed(box, key, val) { box.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset[key] === val))); }
function readoutIdle() { const S = SHELLS[state.size]; $('#readout').textContent = `${S.label}玉　打ち上げ高度 約${S.alt} m・開花の直径 約${S.dia} m`; }

$('#sizeSeg').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  state.size = b.dataset.size; setPressed($('#sizeSeg'), 'size', state.size); readoutIdle();
});
$('#typeRow').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  state.type = b.dataset.type; setPressed($('#typeRow'), 'type', state.type);
});
$('#btnAuto').addEventListener('click', e => {
  state.auto = !state.auto; e.currentTarget.setAttribute('aria-pressed', String(state.auto));
  if (state.auto) { nextAuto = clock + 0.2; $('#hint').classList.add('gone'); }
});
$('#btnSound').addEventListener('click', e => {
  state.sound = !state.sound; e.currentTarget.setAttribute('aria-pressed', String(state.sound));
  if (state.sound) { initAudio(); if (AC && AC.state !== 'running') AC.resume().catch(() => {}); }
});
$('#btnFov').addEventListener('click', e => {
  const panel = $('#fovPanel'); panel.hidden = !panel.hidden;
  e.currentTarget.setAttribute('aria-pressed', String(!panel.hidden));
});
const fovRange = $('#fovRange');
fovRange.value = String(state.fov); $('#fovOut').textContent = state.fov + '°';
fovRange.addEventListener('input', () => {
  state.fov = Number(fovRange.value); $('#fovOut').textContent = state.fov + '°'; updateFocal();
  try { localStorage.setItem('soranotama.fov', String(state.fov)); } catch (e) {}
});

if (!window.isSecureContext) $('#secureNote').hidden = false;

let wake = null;
async function requestWake() {
  try { if ('wakeLock' in navigator && document.visibilityState === 'visible') wake = await navigator.wakeLock.request('screen'); } catch (e) {}
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && state.started) {
    requestWake();
    if (AC && AC.state !== 'running' && state.sound) AC.resume().catch(() => {});
  }
});

async function startCamera() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    setChip(stCam, false, 'カメラなし');
    toast(window.isSecureContext ? 'このブラウザではカメラを使えません' : 'カメラは https:// のページでのみ使えます');
    return;
  }
  try {
    const s = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } },
    });
    video.srcObject = s; video.hidden = false;
    try { await video.play(); } catch (e) {}
    state.camOn = true; document.body.classList.add('cam-on');
    setChip(stCam, true, 'カメラ');
  } catch (e) {
    setChip(stCam, false, 'カメラなし');
    toast(e && e.name === 'NotAllowedError' ? 'カメラの使用が許可されませんでした' : 'カメラを起動できませんでした');
  }
}

function useDragMode(msg) {
  setChip(stGyro, false, 'ドラッグ');
  $('#hint').textContent = 'ドラッグで見回して、タップで打ち上げ';
  toast(msg);
}

function start(withCam) {
  // iOS の許可ダイアログと音声はタップの直後に呼ぶ必要がある
  initAudio();
  if (AC && AC.state !== 'running') AC.resume().catch(() => {});
  let perm = Promise.resolve('granted');
  const DOE = window.DeviceOrientationEvent;
  if (DOE && typeof DOE.requestPermission === 'function') {
    try { perm = DOE.requestPermission(); } catch (e) { perm = Promise.resolve('denied'); }
  }
  state.started = true;
  document.body.classList.remove('intro-open');
  $('#intro').hidden = true;
  groups.length = 0; rockets.length = 0; sparks.length = 0; flashes.length = 0; ambient.a = 0;
  readoutIdle();
  if (withCam) startCamera(); else setChip(stCam, false, 'カメラなし');
  Promise.resolve(perm).then(p => {
    if (p === 'granted') {
      window.addEventListener('deviceorientation', onOrient);
      setTimeout(() => { if (!gotOrient) useDragMode('傾きセンサーが使えないため、ドラッグで見回せます'); }, 1600);
    } else {
      useDragMode('傾きセンサーの許可がないため、ドラッグで見回せます');
    }
  }).catch(() => useDragMode('傾きセンサーの許可がないため、ドラッグで見回せます'));
  requestWake();
}
$('#goCam').addEventListener('click', () => start(true));
$('#goNoCam').addEventListener('click', () => start(false));
})();
</script>
